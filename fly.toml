# Glampire OS API on Fly.io
# https://fly.io/docs/reference/configuration/

app = "glampire-os"
primary_region = "lax"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"
  cpus = 2

# Optional: attach after first deploy
#   fly volumes create glampire_data --region lax --size 20
#   then uncomment:
# [mounts]
#   source = "glampire_data"
#   destination = "/app/server/data"
